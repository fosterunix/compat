[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fosterunix-compat"
version = "0.1.0"
description = "按模型逐一校验工具模式的兼容性，标出不兼容项"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fosterunix" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fosterunix.github.io"
Repository = "https://github.com/fosterunix/compat"
Issues = "https://github.com/fosterunix/compat/issues"

[project.scripts]
compat = "compat:main"

[tool.setuptools]
py-modules = ["compat"]
